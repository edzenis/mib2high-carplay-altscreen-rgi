name: Publish MIB2 Collector v1.1.0-rc1

# One-time publication, triggered only by introducing/updating this workflow file.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-collector-v1.1.0-rc1.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'edzenis/mib2high-carplay-altscreen-rgi'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate source and package collector release
        shell: bash
        run: |
          set -euo pipefail
          sh -n collector/custom.sh
          d="$RUNNER_TEMP/collector-rc1"
          mkdir -p "$d/mod"
          cp collector/custom.sh "$d/mod/custom.sh"
          chmod 755 "$d/mod/custom.sh"
          cp collector/README.md collector/TEST_REPORT.md collector/SHA256SUMS.txt "$d/"
          (cd "$d" && sha256sum -c SHA256SUMS.txt)
          (cd "$d" && zip -q -9 "$RUNNER_TEMP/MIB2_Software_Collector_v1.1.0-rc1.zip" mod/custom.sh README.md TEST_REPORT.md SHA256SUMS.txt)
          unzip -t "$RUNNER_TEMP/MIB2_Software_Collector_v1.1.0-rc1.zip"

      - name: Publish and independently verify replacement release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/MIB2_Software_Collector_v1.1.0-rc1.zip"
          if gh release view collector-v1.1.0-rc1 >/dev/null 2>&1; then
            gh release upload collector-v1.1.0-rc1 "$asset" --clobber
            gh release edit collector-v1.1.0-rc1 --title "MIB2 High Software Collector v1.1.0-rc1" --notes-file collector/RELEASE_NOTES.md --prerelease
          else
            gh release create collector-v1.1.0-rc1 "$asset" --title "MIB2 High Software Collector v1.1.0-rc1" --notes-file collector/RELEASE_NOTES.md --prerelease --target "$GITHUB_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/release-verification"
          gh release download collector-v1.1.0-rc1 --pattern 'MIB2_Software_Collector_v1.1.0-rc1.zip' --dir "$RUNNER_TEMP/release-verification"
          cmp "$asset" "$RUNNER_TEMP/release-verification/MIB2_Software_Collector_v1.1.0-rc1.zip"
          test "$(gh release view collector-v1.1.0-rc1 --json isPrerelease --jq .isPrerelease)" = true
          echo "New collector release and asset verified."

      - name: Delete superseded v1.0.2 release (only after new release verifies)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view collector-v1.0.2 >/dev/null 2>&1; then
            gh release delete collector-v1.0.2 --yes
          fi
          if gh release view collector-v1.0.2 >/dev/null 2>&1; then
            echo "ERROR: obsolete collector release still exists" >&2
            exit 1
          fi
          echo "Superseded release removed; historical git tag retained."
