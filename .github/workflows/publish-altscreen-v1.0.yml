name: Publish AltScreen v1.0 and consolidate branches

# Publish/cleanup ONLY after both verified archives are present.
on:
  push:
    branches:
      - main
    paths:
      - release-staging/AltScreen-v1.0-source.zip
      - release-staging/AltScreen-v1.0-install.zip

permissions:
  contents: write

concurrency:
  group: altscreen-v1-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and compiled v8S packages
        shell: bash
        run: |
          set -euo pipefail
          echo '1e2d6319e3487331ec581e816270f15ab66e6b2bb5eb241303fa94c71474a980  release-staging/AltScreen-v1.0-source.zip' | sha256sum -c -
          echo '162792d28e1a91ade216f41de6b8ff30f848955e285d7de990b34c64fcb7b0ae  release-staging/AltScreen-v1.0-install.zip' | sha256sum -c -
          python3 - <<'PY'
          from hashlib import sha256
          from zipfile import ZipFile
          import json
          source='release-staging/AltScreen-v1.0-source.zip'
          install='release-staging/AltScreen-v1.0-install.zip'
          with ZipFile(source) as s, ZipFile(install) as i:
              assert s.testzip() is None and i.testzip() is None
              files=set(s.namelist())
              for must in ['README.md','RELEASE_NOTES.md','BUILDING.md','native/altscreen_session.c','java/build/src/routeguidance/BAPBridge.java','release_evidence/V8S_PACKAGE_MANIFEST.json']:
                  assert 'altscreen-v1.0-source/'+must in files,must
              manifest=json.loads(s.read('altscreen-v1.0-source/release_evidence/V8S_PACKAGE_MANIFEST.json'))['package_files_sha256']
              assert len(manifest)==12
              for path, expected in manifest.items():
                  digest=sha256(i.read(path)).hexdigest()
                  assert digest==expected,(path,digest,expected)
          print('Exact v8S source and installer: verified')
          PY
          gh release view v1.1 >/dev/null
          test "$(gh release view v1.1 --json isPrerelease --jq .isPrerelease)" = false
          gh release view collector-v1.0.2 >/dev/null
          test "$(gh release view collector-v1.0.2 --json isPrerelease --jq .isPrerelease)" = true
          if gh release view altscreen-v1.0 >/dev/null 2>&1; then
            echo 'AltScreen v1.0 release already exists: aborting without cleanup.' >&2
            exit 2
          fi

      - name: Publish verified editable source to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/altscreen-v1"
          cp release-staging/AltScreen-v1.0-source.zip "$RUNNER_TEMP/altscreen-v1/"
          cp release-staging/AltScreen-v1.0-install.zip "$RUNNER_TEMP/altscreen-v1/"
          unzip -q "$RUNNER_TEMP/altscreen-v1/AltScreen-v1.0-source.zip" -d "$RUNNER_TEMP/altscreen-v1/unpacked"
          test -f "$RUNNER_TEMP/altscreen-v1/unpacked/altscreen-v1.0-source/README.md"
          rm -rf altscreen
          mkdir -p altscreen docs
          cp -a "$RUNNER_TEMP/altscreen-v1/unpacked/altscreen-v1.0-source/." altscreen/
          cp altscreen/README.md docs/ALTSCREEN_V1_0.md
          mv README.md "$RUNNER_TEMP/altscreen-v1/ORIGINAL_RGI_README.md"
          cat > README.md <<'EOF'
          # CarPlay navigation for Audi MIB2 High

          This repository provides community-developed **CarPlay navigation for compatible instrument clusters and factory head-up displays**. It contains a stable HUD route-guidance bridge, a firmware research collector, and **AltScreen**, which puts the CarPlay map in the digital instrument cluster.

          ## Releases

          | Release | Purpose | Status |
          | --- | --- | --- |
          | [RGI v1.1](https://github.com/edzenis/mib2high-carplay-altscreen-rgi/releases/tag/v1.1) | Turn arrows and maneuver distances in the factory HUD | Stable, car-tested |
          | [MIB2 High Software Collector v1.0.2](https://github.com/edzenis/mib2high-carplay-altscreen-rgi/releases/tag/collector-v1.0.2) | Read-only firmware/CarPlay/cluster component research | Prerelease |
          | [AltScreen v1.0](https://github.com/edzenis/mib2high-carplay-altscreen-rgi/releases/tag/altscreen-v1.0) | CarPlay map and instruction card in the instrument cluster, plus HUD RGI | Stable on tested platform |

          ## AltScreen v1.0 — what it does

          AltScreen receives a second CarPlay video stream for the instrument cluster. It shows the map next to the gauges, adapts the instruction card to different layouts, and follows VIEW button layout changes. A **separate RGI path** delivers maneuver information to the **factory HUD** via the car's existing interface.

          **Car-tested reference:** Audi Q7 4M, Harman MIB2 High K2161/MU1421, digital instrument cluster and HUD. Other cars, firmware versions and wireless adapters are not automatically supported. Native Virtual Cockpit graphics may still appear alongside the map.

          **Read the full [AltScreen guide](altscreen/README.md)** for features, architecture, compatibility, installation and rollback.

          ## Source and development

          The \`main\` branch holds public stable source; \`dev\` is for future changes. AltScreen v1.0 source lives in [\`altscreen/\`](altscreen/) and [build notes](altscreen/BUILDING.md) explain toolchains and prerequisites. Change editable source and rebuild; never patch compiled binaries or Java bytecode.

          ---

          ## Original RGI documentation
          EOF
          cat "$RUNNER_TEMP/altscreen-v1/ORIGINAL_RGI_README.md" >> README.md
          git rm -f --ignore-unmatch release-staging/AltScreen-v1.0-source.zip release-staging/AltScreen-v1.0-install.zip release-staging/.gitkeep
          git add README.md docs/ALTSCREEN_V1_0.md altscreen
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: publish AltScreen v1.0 car-tested v8S source and documentation'
          git push origin HEAD:refs/heads/main

      - name: Create AltScreen v1.0 release with BOTH archives
        shell: bash
        run: |
          set -euo pipefail
          gh release create altscreen-v1.0 \
            "$RUNNER_TEMP/altscreen-v1/AltScreen-v1.0-source.zip#Editable source archive" \
            "$RUNNER_TEMP/altscreen-v1/AltScreen-v1.0-install.zip#Compiled SD-card installer (unchanged v8S)" \
            --target "$(git rev-parse HEAD)" \
            --title 'AltScreen v1.0' \
            --notes-file altscreen/RELEASE_NOTES.md \
            --latest
          test "$(gh release view altscreen-v1.0 --json assets --jq '.assets | length')" = 2

      - name: Make dev start from the published main
        shell: bash
        run: |
          set -euo pipefail
          DEV_HEAD=$(git ls-remote origin refs/heads/dev | awk '{print $1}')
          test -n "$DEV_HEAD"
          git push origin "HEAD:refs/heads/dev" "--force-with-lease=refs/heads/dev:$DEV_HEAD"

      - name: Remove obsolete branch refs and old release entries
        shell: bash
        run: |
          set -euo pipefail
          for branch in altscreen_dev altscreen_port k2161-gen2-av11-sink k2161-gen2-core qnx49-toolchain-bootstrap qnx-toolchain-bootstrap run8-build run8-source-export v8b-touchpad-port; do
            echo "Remove obsolete branch: $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
          for tag in v1.2.0-dev.1 v1.2.0-dev.2 v1.2.0-dev.3 v1.0.0; do
            echo "Remove obsolete release: $tag (keep historical Git tag)"
            gh release delete "$tag" --yes
          done

      - name: Verify final 2 branches and 3 releases
        shell: bash
        run: |
          set -euo pipefail
          BRANCHES=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)
          RELEASES=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | sort)
          printf 'Branches:\n%s\nReleases:\n%s\n' "$BRANCHES" "$RELEASES"
          test "$BRANCHES" = "$(printf 'dev\nmain')"
          test "$RELEASES" = "$(printf 'altscreen-v1.0\ncollector-v1.0.2\nv1.1')"
